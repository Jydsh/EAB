<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>EAB Agent · OnlyOffice</title>
    <style>
      :root {
        color-scheme: dark;
        --ink: #e8f2f4;
        --muted: #8ea3a8;
        --line: rgba(159, 197, 204, 0.22);
        --panel: #11181c;
        --panel-2: #162126;
        --cyan: #56e0d0;
        --amber: #f0b45a;
        --red: #ff6b6b;
      }
      * { box-sizing: border-box; }
      [hidden] { display: none !important; }
      html, body { height: 100%; }
      body {
        margin: 0;
        background:
          radial-gradient(circle at 18% 0%, rgba(86, 224, 208, 0.13), transparent 34%),
          linear-gradient(160deg, #0b1114, #111b20 62%, #0d1518);
        color: var(--ink);
        font: 13px/1.5 "Segoe UI", "Microsoft YaHei UI", sans-serif;
      }
      .shell {
        min-height: 100%;
        display: flex;
        flex-direction: column;
        padding: 14px 14px 12px;
        gap: 12px;
      }
      .top {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 10px;
      }
      .brand { display: flex; align-items: center; gap: 9px; min-width: 0; }
      .mark {
        width: 34px;
        height: 34px;
        display: grid;
        place-items: center;
        border: 1px solid rgba(86, 224, 208, 0.5);
        border-radius: 9px;
        color: var(--cyan);
        font: 700 11px/1 "Segoe UI", sans-serif;
        letter-spacing: 0.08em;
        box-shadow: inset 0 0 18px rgba(86, 224, 208, 0.12);
      }
      .brand strong { display: block; font-size: 12px; letter-spacing: 0.12em; }
      .brand small { display: block; color: var(--muted); font-size: 10px; letter-spacing: 0.04em; }
      .status {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        flex: none;
        border: 1px solid var(--line);
        border-radius: 999px;
        padding: 5px 8px;
        color: var(--muted);
        font-size: 10px;
        white-space: nowrap;
      }
      .status i {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: var(--amber);
        box-shadow: 0 0 0 3px rgba(240, 180, 90, 0.12);
      }
      .status[data-state="ready"] { color: var(--cyan); border-color: rgba(86, 224, 208, 0.28); }
      .status[data-state="ready"] i { background: var(--cyan); box-shadow: 0 0 0 3px rgba(86, 224, 208, 0.12); }
      .status[data-state="error"] { color: var(--red); border-color: rgba(255, 107, 107, 0.3); }
      .status[data-state="error"] i { background: var(--red); box-shadow: 0 0 0 3px rgba(255, 107, 107, 0.1); }

      .doc {
        border: 1px solid var(--line);
        border-radius: 12px;
        background: linear-gradient(180deg, rgba(22, 33, 38, 0.92), rgba(15, 23, 27, 0.92));
        padding: 11px;
        box-shadow: 0 12px 30px rgba(0, 0, 0, 0.22);
      }
      .eyebrow { color: var(--muted); font-size: 9px; letter-spacing: 0.16em; text-transform: uppercase; }
      .doc-name {
        margin: 5px 0 8px;
        font-size: 13px;
        font-weight: 600;
        line-height: 1.35;
        word-break: break-all;
      }
      .meta { display: flex; flex-wrap: wrap; gap: 5px; }
      .chip {
        border: 1px solid var(--line);
        border-radius: 999px;
        padding: 3px 7px;
        color: var(--muted);
        font-size: 10px;
      }
      .chip.hot { color: var(--cyan); border-color: rgba(86, 224, 208, 0.28); }

      .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
      .actions .wide { grid-column: 1 / -1; }
      .review {
        display: grid;
        gap: 8px;
        border: 1px solid var(--line);
        border-radius: 12px;
        background: rgba(7, 11, 13, 0.3);
        padding: 9px;
      }
      .review-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
      .review-head span { color: var(--muted); font-size: 9px; letter-spacing: 0.14em; }
      .review-head strong { color: var(--ink); font-size: 10px; font-weight: 600; text-align: right; }
      .review-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
      .cell-actions { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; }
      .slide-actions { display: grid; grid-template-columns: 1fr; gap: 8px; }
      .slide-hint { margin: 0; color: var(--muted); font-size: 10px; line-height: 1.5; }
      .cell-actions input {
        min-width: 0;
        border: 1px solid var(--line);
        border-radius: 9px;
        background: rgba(255, 255, 255, 0.03);
        color: var(--ink);
        padding: 8px 9px;
        font: 11px/1.3 "Segoe UI", "Microsoft YaHei UI", sans-serif;
      }
      .cell-actions input::placeholder { color: var(--muted); }
      .cell-actions input:focus-visible { outline: 2px solid var(--amber); outline-offset: 1px; }
      .cell-actions input:disabled { opacity: 0.45; }
      #track-toggle { grid-column: 1 / -1; }
      #track-toggle[aria-pressed="true"] { color: var(--cyan); border-color: rgba(86, 224, 208, 0.55); background: rgba(86, 224, 208, 0.14); }
      #revisions-accept, #revisions-reject { border-color: rgba(255, 107, 107, 0.28); background: rgba(255, 107, 107, 0.06); }
      .locate { display: flex; gap: 8px; }
      .locate input {
        min-width: 0;
        flex: 1;
        border: 1px solid var(--line);
        border-radius: 9px;
        background: rgba(255, 255, 255, 0.03);
        color: var(--ink);
        padding: 8px 9px;
        font: 11px/1.3 "Segoe UI", "Microsoft YaHei UI", sans-serif;
      }
      .locate input::placeholder { color: var(--muted); }
      .locate input:focus-visible { outline: 2px solid var(--amber); outline-offset: 1px; }
      .locate input:disabled { opacity: 0.45; }
      .locate button { flex: none; padding: 8px 9px; }
      button {
        appearance: none;
        border: 1px solid rgba(86, 224, 208, 0.28);
        border-radius: 9px;
        background: rgba(86, 224, 208, 0.08);
        color: var(--ink);
        padding: 9px 8px;
        font: 600 11px/1.2 "Segoe UI", "Microsoft YaHei UI", sans-serif;
        cursor: pointer;
        transition: background 120ms ease, border-color 120ms ease, transform 120ms ease;
      }
      button:hover { background: rgba(86, 224, 208, 0.16); border-color: rgba(86, 224, 208, 0.52); }
      button:active { transform: translateY(1px); }
      button:focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; }
      button[data-quiet] { border-color: var(--line); background: rgba(255, 255, 255, 0.02); color: var(--muted); }
      button:disabled { opacity: 0.45; cursor: not-allowed; }

      .log {
        flex: 1;
        min-height: 118px;
        border: 1px solid var(--line);
        border-radius: 12px;
        background: rgba(7, 11, 13, 0.46);
        padding: 10px;
        overflow: auto;
      }
      .log-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
      .log-head span { color: var(--muted); font-size: 9px; letter-spacing: 0.14em; }
      .log-list { display: grid; gap: 7px; }
      .empty { color: var(--muted); font-size: 11px; }
      .entry {
        border-left: 2px solid rgba(86, 224, 208, 0.42);
        padding: 2px 0 2px 8px;
      }
      .entry b { display: block; color: var(--ink); font-size: 11px; font-weight: 600; }
      .entry time { display: block; color: var(--muted); font-size: 9px; margin-top: 1px; }
      .entry p { margin: 4px 0 0; color: #b9c9cc; font-size: 11px; line-height: 1.55; word-break: break-word; }
      .entry.error { border-left-color: var(--red); }

      footer {
        color: var(--muted);
        font-size: 9px;
        letter-spacing: 0.08em;
        display: flex;
        justify-content: space-between;
        gap: 8px;
      }
      @media (max-width: 260px) {
        .actions { grid-template-columns: 1fr; }
        .locate { flex-direction: column; }
        .status { padding: 4px 6px; }
      }
      @media (prefers-reduced-motion: reduce) {
        * { transition: none !important; }
      }
    </style>
  </head>
  <body>
    <main class="shell">
      <header class="top">
        <div class="brand">
          <span class="mark">EAB</span>
          <div>
            <strong>AGENT RUNTIME</strong>
            <small>OnlyOffice bridge</small>
          </div>
        </div>
        <span class="status" id="status" data-state="loading" aria-live="polite"><i></i><span>连接中</span></span>
      </header>

      <section class="doc" aria-labelledby="doc-title">
        <div class="eyebrow">BOUND DOCUMENT</div>
        <div class="doc-name" id="doc-title">等待文档上下文…</div>
        <div class="meta" id="meta">
          <span class="chip">token 校验中</span>
        </div>
      </section>

      <section class="actions" aria-label="文档操作">
        <button id="save" class="wide" type="button" disabled title="仅编辑模式可用；立即请求 OnlyOffice 保存当前编辑内容">
          保存到云空间
        </button>
        <button id="read" type="button" disabled>读取文档结构</button>
        <button id="refresh" type="button" data-quiet>刷新上下文</button>
        <button id="reopen" class="wide" type="button" data-quiet hidden>重新打开预览</button>
        <button id="highlight" class="wide" type="button" disabled title="仅编辑模式可用；会修改文档格式，可用“保存到云空间”回写">
          高亮全部命中
        </button>
      </section>

      <section class="review" id="review-section" aria-labelledby="review-title">
        <div class="review-head">
          <span id="review-title">REVISIONS</span>
          <strong id="review-summary" aria-live="polite">未读取</strong>
        </div>
        <div class="review-actions">
          <button id="track-toggle" type="button" aria-pressed="false" disabled title="仅编辑模式可用；开启后新的文本修改会写入修订标记">
            开启修订
          </button>
          <button id="revisions-read" type="button" disabled>读取修订</button>
          <button id="revisions-accept" type="button" disabled title="仅编辑模式可用；接受当前文档全部修订">
            接受全部
          </button>
          <button id="revisions-reject" type="button" disabled title="仅编辑模式可用；拒绝当前文档全部修订">
            拒绝全部
          </button>
        </div>
      </section>

      <section class="review" id="cell-section" hidden aria-labelledby="cell-title">
        <div class="review-head">
          <span id="cell-title">WORKSHEET</span>
          <strong id="cell-summary" aria-live="polite">未读取</strong>
        </div>
        <div class="cell-actions">
          <input id="cell-replace-value" type="text" placeholder="替换选中的值…" disabled />
          <button id="cell-replace" type="button" disabled title="仅编辑模式可用；替换当前选中的单元格">替换选中</button>
        </div>
      </section>

      <section class="review" id="slide-section" hidden aria-labelledby="slide-title">
        <div class="review-head">
          <span id="slide-title">PRESENTATION</span>
          <strong id="slide-summary" aria-live="polite">未读取</strong>
        </div>
        <div class="slide-actions">
          <button id="slide-read" type="button" disabled title="读取幻灯片页数、形状数量和每页文本">读取幻灯片</button>
        </div>
        <p class="slide-hint">用下方定位框查找文本；命中后会跳转幻灯片并选中形状。</p>
      </section>

      <section class="locate" aria-label="在文档中定位文本">
        <input id="locate-query" type="search" placeholder="定位文本并选中…" disabled />
        <button id="locate" type="button" disabled>定位</button>
      </section>

      <section class="log" aria-label="执行记录">
        <div class="log-head">
          <span>EXECUTION LOG</span>
          <span id="phase">IDLE</span>
        </div>
        <div class="log-list" id="log">
          <div class="empty">插件已启动，等待连接 EAB。</div>
        </div>
      </section>

      <footer>
        <span>ONLYOFFICE 10.0.0</span>
        <span>L2 · PLUGIN LAYER</span>
      </footer>
    </main>
    <script src="https://onlyoffice.github.io/sdkjs-plugins/v1/plugins.js"></script>
    <script src="plugin.js?v=20261114h"></script>
  </body>
</html>
