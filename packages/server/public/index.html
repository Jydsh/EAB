<!doctype html>
<html lang="zh-CN" style="background:#04110d">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>EAB 管理控制台</title>
    <style>
      /* 首帧兜底：只保留启动层最必要的绘制规则，详细视觉仍由 boot-splash.css 接管。 */
      html { background: #04110d; }
      html.eab-booting,
      html.eab-booting body { background: #04110d; overflow: hidden; }
      .eab-boot {
        position: fixed;
        inset: 0;
        z-index: 2147483000;
        display: grid;
        place-items: center;
        overflow: hidden;
        background: #04110d;
        color: #e8f6f0;
      }
      .eab-boot[hidden] { display: none; }
    </style>
    <script src="/theme.js?v=20261117a" data-surface="admin"></script>
    <script src="/brand.js?v=20261115c" defer></script>
    <link rel="stylesheet" href="/app.css?v=20261123m" />
    <link rel="stylesheet" href="/kb-pipeline.css?v=20261118d8" />
    <link rel="stylesheet" href="/theme.css?v=20261115b" />
    <link rel="stylesheet" href="/boot-splash.css?v=20261115i" />
  </head>
  <body>
    <script src="/boot/config.js?surface=admin" defer></script>
    <div class="eab-boot" id="eab-boot" hidden aria-hidden="true" aria-live="polite">
      <div class="eab-boot-atmosphere" aria-hidden="true">
        <span class="eab-boot-glow"></span>
        <span class="eab-boot-grid"></span>
        <span class="eab-boot-sweep"></span>
        <span class="eab-boot-grain"></span>
      </div>
      <video class="eab-boot-video" id="eab-boot-video" muted playsinline preload="metadata" hidden></video>
      <div class="eab-boot-code" id="eab-boot-code" aria-hidden="true">
        <div class="eab-boot-mark">
          <span class="eab-boot-square s1"></span>
          <span class="eab-boot-square s2"></span>
          <span class="eab-boot-square s3"></span>
          <span class="eab-boot-square s4"></span>
        </div>
        <div class="eab-boot-word" id="eab-boot-title">EAB</div>
        <div class="eab-boot-sub" id="eab-boot-subtitle">管理控制台</div>
      </div>
      <div class="eab-boot-film-copy" aria-hidden="true">
        <strong id="eab-boot-film-title">EAB</strong>
        <span id="eab-boot-film-subtitle">管理控制台</span>
      </div>
      <div class="eab-boot-ui">
        <span class="eab-boot-ring" aria-hidden="true"></span>
        <span class="eab-boot-status" id="eab-boot-status">正在加载控制台配置…</span>
      </div>
      <div class="eab-boot-actions">
        <button class="eab-boot-sound" id="eab-boot-sound" type="button" hidden>开启声音</button>
        <button class="eab-boot-skip" id="eab-boot-skip" type="button" hidden>跳过</button>
      </div>
      <button class="eab-boot-play" id="eab-boot-play" type="button" hidden>点击播放片头</button>
    </div>
    <script>
      (function () {
        // 启动层必须先于配置请求出现：配置即使失败或很慢，也不能先露出白底。
        var overlay = document.getElementById('eab-boot')
        if (overlay) {
          overlay.hidden = false
          overlay.setAttribute('aria-hidden', 'false')
          document.documentElement.classList.add('eab-booting')
          document.documentElement.style.background = '#04110d'
        }
        setTimeout(function () {
          if (!window.EABBoot && overlay) {
            overlay.hidden = true
            overlay.setAttribute('aria-hidden', 'true')
            document.documentElement.classList.remove('eab-booting')
            document.documentElement.style.background = 'transparent'
          }
        }, 2500)
      })()
    </script>
    <!-- 顶栏：品牌 + 当前公司 + 服务状态 + 退出。控制台不登录组织成员，这里没有"我是谁"。 -->
    <header class="topbar">
      <div class="brand">
        <span class="logo" data-brand-logo>EAB</span>
        <div class="brand-text">
          <h1 data-brand-name>企业智能体基座</h1>
          <p class="sub">管理控制台</p>
        </div>
      </div>
      <div class="topbar-company" id="company-picker" aria-label="当前管理公司"></div>
      <div class="who">
        <button class="theme-toggle" type="button" data-theme-toggle role="switch" aria-checked="false" aria-label="切换到深色主题" title="切换深浅色主题">
          <span class="theme-toggle-track">
            <span class="theme-toggle-knob" aria-hidden="true">
              <svg class="theme-icon sun" viewBox="0 0 16 16" shape-rendering="crispEdges" fill="currentColor">
                <rect x="7" y="0" width="2" height="3" />
                <rect x="7" y="13" width="2" height="3" />
                <rect x="0" y="7" width="3" height="2" />
                <rect x="13" y="7" width="3" height="2" />
                <rect x="2" y="2" width="2" height="2" />
                <rect x="12" y="2" width="2" height="2" />
                <rect x="2" y="12" width="2" height="2" />
                <rect x="12" y="12" width="2" height="2" />
                <rect x="5" y="5" width="6" height="1" />
                <rect x="4" y="6" width="8" height="4" />
                <rect x="5" y="10" width="6" height="1" />
              </svg>
              <svg class="theme-icon moon" viewBox="0 0 16 16" fill="currentColor">
                <path d="M13.6 8.6A5.6 5.6 0 1 1 7.4 3 4.4 4.4 0 0 0 6.6 6.4 4.4 4.4 0 0 0 13.6 8.6Z" />
              </svg>
            </span>
          </span>
        </button>
        <span id="health-dot" class="dot" title="服务状态"></span>
        <span id="health-text" class="health-text">连接中</span>
        <button class="update-badge" id="update-badge" type="button" hidden></button>
        <span class="who-divider"></span>
        <div class="account" id="account">
          <button class="account-btn" id="account-toggle" type="button" aria-haspopup="true" aria-expanded="false">
            <span class="account-avatar" id="account-avatar" aria-hidden="true">管</span>
            <span class="account-name">
              <strong id="account-name">超级管理员</strong>
            </span>
            <span class="account-caret" aria-hidden="true">▾</span>
          </button>
          <div class="account-pop" id="account-pop" hidden>
            <div class="account-head">
              <span class="account-avatar lg" id="account-avatar-pop" aria-hidden="true">管</span>
              <div class="account-head-text">
                <strong id="account-name-pop">超级管理员</strong>
                <small id="account-user">admin</small>
              </div>
            </div>
            <div class="account-meta" id="account-meta">加载中…</div>
            <div class="account-menu">
              <button type="button" data-account-action="password" id="account-password">
                <span>修改密码</span>
                <small>更新控制台登录口令</small>
              </button>
              <button type="button" data-account-action="chat" id="account-return-chat" hidden>
                <span>返回对话</span>
                <small>回到员工对话页面</small>
              </button>
              <button type="button" class="danger" data-account-action="logout">
                <span>退出登录</span>
                <small>结束当前控制台会话</small>
              </button>
            </div>
          </div>
        </div>
      </div>
    </header>

    <!-- 一级导航：悬停后自身向下展开一行，横排显示当前业务域的二级页面 -->
    <nav class="topnav primary-nav" id="topnav" aria-label="业务域导航">
      <div class="topnav-row" id="topnav-row">
        <button class="nav-primary" type="button" data-domain="overview">概览</button>
        <button class="nav-primary" type="button" data-domain="org">组织与权限</button>
        <button class="nav-primary" type="button" data-domain="knowledge">知识与模型</button>
        <button class="nav-primary" type="button" data-domain="platform">连接与平台</button>
        <button class="nav-primary" type="button" data-domain="features">功能管理</button>
        <button class="nav-primary" type="button" data-domain="ops">运营与审计</button>
        <button class="nav-primary" type="button" data-domain="system">系统</button>
        <div class="nav-tail" id="nav-tail"></div>
      </div>
      <div class="nav-subbar" id="nav-subbar" aria-hidden="true">
        <div class="nav-subbar-inner" id="nav-subbar-inner" aria-label="二级页面导航"></div>
      </div>
    </nav>

    <div class="workspace no-side">
      <!-- 插件 / 技能页的左侧列表属于页面内容，不属于全站二级导航；其余页面不再常驻侧栏 -->
      <aside class="nav-rail" id="nav-rail" aria-label="页面列表"></aside>

      <main class="page">
        <div class="page-head is-headingless">
          <div class="page-heading">
            <div class="page-kicker" id="page-kicker">EAB CONFIG</div>
            <h1 id="page-title">概览</h1>
            <p class="page-sub" id="page-sub">服务状态与配置入口</p>
          </div>
          <div class="page-head-right">
            <div class="page-actions" id="page-actions"></div>
          </div>
        </div>

        <!-- 页内 rail：组织树 / 知识库列表 / 角色列表这类"本页选择器"，不是全站导航 -->
        <div class="page-body no-rail" id="page-body">
          <aside class="page-rail" id="page-rail" aria-label="页内选择器"></aside>
          <div id="view" class="view"></div>
        </div>
      </main>
    </div>

    <script src="/boot-splash.js?v=20261118d" data-surface="admin" defer></script>
    <script src="/app.js?v=20261123x" defer></script>
  </body>
</html>
