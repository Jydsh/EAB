<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>我的便签</title>
    <style>
      body { margin: 0; padding: 24px; background: #f6f7f9; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; color: #1f2329; }
      h1 { font-size: 20px; margin: 0 0 6px; }
      p { margin: 0 0 18px; color: #4e5969; font-size: 13px; }
      .board { display: grid; gap: 10px; }
      .note { padding: 14px; border-radius: 12px; background: #fff; border: 1px solid #e5e6eb; box-shadow: 0 4px 14px rgba(31,35,41,.05); }
      .note strong { display: block; margin-bottom: 4px; }
      .note span { color: #86909c; font-size: 12px; }
    </style>
  </head>
  <body>
    <h1>我的便签</h1>
    <p>这是一个员工自己开发的插件页面；装到个人工作台后从卡片入口打开即可。</p>
    <div class="board">
      <div class="note"><strong>第一件事</strong><span>验证个人插件装完入口就在工作台</span></div>
      <div class="note"><strong>第二件事</strong><span>页面由插件自己提供，EAB 只负责归属与启停</span></div>
    </div>
  </body>
</html>
