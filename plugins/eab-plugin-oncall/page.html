<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>值班表 · EAB 插件</title>
    <style>
      :root {
        --brand: #0f6b5c;
        --line: #e2e9e7;
        --text: #14201d;
        --muted: #77857f;
        --surface: #ffffff;
        --bg: #f6f8f8;
      }
      body {
        margin: 0;
        padding: 0;
        background: var(--bg);
        color: var(--text);
        font: 13.5px/1.6 "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
      }
      .wrap {
        padding: 16px 18px 22px;
      }
      h1 {
        margin: 0 0 4px;
        font-size: 16px;
        font-weight: 650;
      }
      .sub {
        margin: 0 0 14px;
        font-size: 12px;
        color: var(--muted);
      }
      .bar {
        display: flex;
        gap: 8px;
        align-items: center;
        margin-bottom: 12px;
      }
      select,
      button {
        height: 30px;
        padding: 0 10px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--surface);
        font-size: 12.5px;
        color: var(--text);
      }
      button.primary {
        background: var(--brand);
        border-color: var(--brand);
        color: #fff;
        cursor: pointer;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 10px;
        overflow: hidden;
        font-size: 12.5px;
      }
      th,
      td {
        padding: 8px 10px;
        text-align: left;
        border-bottom: 1px solid var(--line);
      }
      th {
        color: var(--muted);
        font-weight: 600;
        background: #fbfcfc;
      }
      tr:last-child td {
        border-bottom: 0;
      }
      .pill {
        display: inline-block;
        padding: 1px 8px;
        border-radius: 999px;
        background: #e7f2ef;
        color: var(--brand);
        font-size: 11.5px;
      }
      .note {
        margin-top: 12px;
        font-size: 11.5px;
        color: var(--muted);
      }
      .err {
        margin: 12px 0;
        padding: 10px 12px;
        border: 1px solid rgba(180, 35, 24, 0.25);
        border-radius: 8px;
        background: #fdf1f0;
        color: #912018;
        font-size: 12.5px;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <h1>值班表</h1>
      <p class="sub">插件演示：用组织成员数据排一张周表。它没有自己的后端，取数走 EAB 的 HTTP API。</p>
      <div class="bar">
        <select id="dept"><option value="">全部部门</option></select>
        <button class="primary" id="gen">生成 7 天值班</button>
        <span class="sub" id="who" style="margin: 0"></span>
      </div>
      <div id="err"></div>
      <table id="table" hidden>
        <thead>
          <tr><th>日期</th><th>值班人</th><th>部门</th><th>角色</th></tr>
        </thead>
        <tbody></tbody>
      </table>
      <div class="note">插件页面在 iframe 里渲染（沙箱隔离），拿不到主控制台的 DOM；要数据就调 API。</div>
    </div>
    <script>
      const qsCompany = () => new URLSearchParams(location.search).get('company')
      const withQuery = (path) => {
        const params = []
        const company = qsCompany()
        if (company) params.push('company=' + encodeURIComponent(company))
        if (!params.length) return path
        return path + (path.includes('?') ? '&' : '?') + params.join('&')
      }

      async function api(path) {
        const res = await fetch(withQuery(path), { headers: { 'x-eab-console': '1' } })
        const body = await res.json()
        if (!res.ok || body.ok === false) throw new Error((body.error && body.error.message) || 'HTTP ' + res.status)
        return body.data
      }

      function days(count) {
        const out = []
        const today = new Date()
        for (let i = 0; i < count; i += 1) {
          const day = new Date(today.getTime() + i * 86400000)
          out.push({
            label: day.getMonth() + 1 + '月' + day.getDate() + '日 周' + '日一二三四五六'[day.getDay()],
            key: day.toISOString().slice(0, 10),
          })
        }
        return out
      }

      async function boot() {
        try {
          const me = await api('/api/me')
          document.getElementById('who').textContent = me.person.name + ' · ' + me.person.deptName

          const members = await api('/api/org/members')
          const depts = [...new Set(members.members.map((m) => m.deptPath))]
          const select = document.getElementById('dept')
          select.innerHTML =
            '<option value="">全部部门</option>' +
            depts.map((path) => '<option value="' + path + '">' + path + '</option>').join('')

          const pick = () => {
            const filter = select.value
            const pool = members.members.filter(
              (m) => !filter || m.deptPath.startsWith(filter),
            )
            return pool.filter((m) => m.status === 'active')
          }

          document.getElementById('gen').addEventListener('click', () => {
            const pool = pick()
            if (pool.length === 0) {
              document.getElementById('err').innerHTML = '<div class="err">该部门没有在职成员，排班排不出来</div>'
              return
            }
            document.getElementById('err').innerHTML = ''
            const tbody = document.querySelector('#table tbody')
            tbody.innerHTML = days(7)
              .map((day, index) => {
                const person = pool[index % pool.length]
                return (
                  '<tr><td>' + day.label + '</td><td><strong>' + person.name + '</strong></td><td>' +
                  person.deptPath + '</td><td><span class="pill">' + person.title + '</span></td></tr>'
                )
              })
              .join('')
            document.getElementById('table').hidden = false
          })
        } catch (err) {
          document.getElementById('err').innerHTML = '<div class="err">' + err.message + '</div>'
        }
      }

      boot()
    </script>
  </body>
</html>
